name: Build image

# Builds the Dockerfile and publishes the image to this repository's own
# registry: ghcr.io/<your-user>/<this-repository>. Nothing to set up: it uses
# the token GitHub gives every workflow run.
#
#   on every push to main      :latest and :<commit>
#   once a week                the same, to pick up updates of the base image
#   by hand                    "Run workflow" on the Actions page
#   on a pull request          built and tested, not published
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The processor types to build for. A Raspberry Pi or an Apple computer
  # needs linux/arm64; drop the one you do not use to build faster.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: name
        # Registry names are lower case, whatever the repository is called.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # First for this machine only, to try the image out before publishing.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: custom:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: test/test.sh custom:test

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Where the image is
        if: github.event_name != 'pull_request'
        run: |
          echo "Published ${{ steps.name.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
