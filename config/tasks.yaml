# The tasks of your image. This file starts as a copy of the official
# "lossless" profile: JPEG and PNG become JPEG XL without any loss, everything
# else is stored as it is.
#
# Documentation: https://github.com/miguelangel-nubla/immich-optimizer/blob/main/docs/tasks.md
#
# How tasks are picked: for each file, the tasks that list its extension are
# tried from top to bottom until one succeeds. So an example you switch on
# below runs before the plain task for the same file type further down, and
# that one remains as the fallback if yours fails.
#
# The result is only used when it is smaller than the original.
#
# To switch an example on, remove the leading "# " from its lines.

# What a task receives when the file is a motion photo (a photo with a short
# embedded video): keep (as it is), drop_video (only the photo) or drop_photo
# (only the video). This is the default for every task below; a task can set
# its own "motion_photos:" to override it.
motion_photos: drop_video

# Proxy mode: hand an original out in another format when it is downloaded.
# What is stored as JPEG XL is downloaded as JPEG, which everything opens.
# Remove this list to download files as they are stored. See docs/tasks.md,
# "Downloads".
downloads:
- name: jxl-to-jpeg
  command: |
    djxl \
      "{{.src_folder}}/{{.name}}.{{.extension}}" \
      "{{.dst_folder}}/{{.name}}.jpg"
  extensions:
  - jxl

tasks:
# ---------------------------------------------------------------------------
# EXAMPLES. All commented out.
# ---------------------------------------------------------------------------

# --- Photos: smaller, with loss -------------------------------------------
# Any photo to JPEG XL at quality 80, at most 4096 pixels on the long side.
# The metadata is copied back, and the photo is stored upright.
#
# - name: photos-jxl-lossy
#   command: |
#     magick "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -auto-orient \
#       -resize 4096x4096\> \
#       ppm:- \
#     | cjxl - "{{.dst_folder}}/{{.name}}.jxl" \
#       -q 80 \
#       --effort=7 \
#     && exiftool -overwrite_original \
#       -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -all:all -m -Orientation#=1 \
#       -XMP-GCamera:MotionPhoto= -XMP-GCamera:MotionPhotoVersion= \
#       -XMP-GCamera:MotionPhotoPresentationTimestampUs= \
#       "{{.dst_folder}}/{{.name}}.jxl"
#   extensions: [avif, bmp, gif, heic, heif, jpeg, jpg, png, tiff, tif, webp]

# Any photo to AVIF. Needs the libavif-bin package (Dockerfile).
# A lower -q is smaller; -s is the effort, 0 (slowest) to 10.
#
# - name: photos-avif
#   command: |
#     avifenc -q 60 -s 6 \
#       "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       "{{.dst_folder}}/{{.name}}.avif"
#   extensions: [jpeg, jpg, png]

# --- Videos on a graphics card --------------------------------------------
# All three keep the video upright, limit it to 1920 pixels on the long side,
# and copy the metadata (date, place, camera) back with exiftool.
#
# Videos straight from a current phone are already compact. Expect a saving
# on older or high-bitrate video, and often none on phone video: the original
# is kept whenever the result is not smaller.

# AMD, or Intel through VAAPI. Needs /dev/dri in the container (README.md).
# A lower -qp is better and bigger; 22 is close to the source, 26 to 28 saves
# more.
#
# - name: videos-vaapi-hevc
#   command: |
#     ffmpeg -hide_banner -y \
#       -hwaccel vaapi -hwaccel_device /dev/dri/renderD128 \
#       -i "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -vf "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(ih,iw),min(1920,ih),-2)':flags=lanczos,format=p010,hwupload" \
#       -c:v hevc_vaapi -profile:v main10 -qp 26 \
#       -c:a libopus -b:a 128k \
#       "{{.dst_folder}}/{{.name}}.mp4" \
#     && exiftool -overwrite_original \
#       -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -all:all -m -FileModifyDate "{{.dst_folder}}/{{.name}}.mp4"
#   extensions: [3gp, 3gpp, avi, flv, insv, m2t, m2ts, m4v, mkv, mov, mp4, mpe, mpeg, mpg, mts, webm, wmv]

# NVIDIA. Needs the NVIDIA Container Toolkit on the host (README.md).
# A lower -cq is better and bigger. Cards of the RTX 40 series and newer can
# also write AV1: use av1_nvenc in place of hevc_nvenc and drop -profile:v.
#
# - name: videos-nvenc-hevc
#   command: |
#     ffmpeg -hide_banner -y \
#       -i "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -vf "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(ih,iw),min(1920,ih),-2)':flags=lanczos,format=p010le" \
#       -c:v hevc_nvenc -profile:v main10 -preset p6 -rc vbr -cq 28 -b:v 0 \
#       -c:a libopus -b:a 128k \
#       "{{.dst_folder}}/{{.name}}.mp4" \
#     && exiftool -overwrite_original \
#       -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -all:all -m -FileModifyDate "{{.dst_folder}}/{{.name}}.mp4"
#   extensions: [3gp, 3gpp, avi, flv, insv, m2t, m2ts, m4v, mkv, mov, mp4, mpe, mpeg, mpg, mts, webm, wmv]

# --- Videos on the CPU -----------------------------------------------------
# No graphics card needed, and the best quality for the size, but slow.
# A lower -crf is better and bigger.
#
# - name: videos-x265
#   command: |
#     ffmpeg -hide_banner -y \
#       -i "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -vf "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(ih,iw),min(1920,ih),-2)':flags=lanczos" \
#       -c:v libx265 -preset medium -crf 26 -tag:v hvc1 \
#       -c:a libopus -b:a 128k \
#       "{{.dst_folder}}/{{.name}}.mp4" \
#     && exiftool -overwrite_original \
#       -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -all:all -m -FileModifyDate "{{.dst_folder}}/{{.name}}.mp4"
#   extensions: [3gp, 3gpp, avi, flv, insv, m2t, m2ts, m4v, mkv, mov, mp4, mpe, mpeg, mpg, mts, webm, wmv]

# The same to AV1, which is smaller still. iPhones before the 15 Pro and Macs
# before the M3 cannot play AV1, which matters when a video is downloaded.
#
# - name: videos-svtav1
#   command: |
#     ffmpeg -hide_banner -y \
#       -i "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -vf "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(ih,iw),min(1920,ih),-2)':flags=lanczos" \
#       -c:v libsvtav1 -preset 6 -crf 32 \
#       -c:a libopus -b:a 128k \
#       "{{.dst_folder}}/{{.name}}.mp4" \
#     && exiftool -overwrite_original \
#       -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
#       -all:all -m -FileModifyDate "{{.dst_folder}}/{{.name}}.mp4"
#   extensions: [3gp, 3gpp, avi, flv, insv, m2t, m2ts, m4v, mkv, mov, mp4, mpe, mpeg, mpg, mts, webm, wmv]

# ---------------------------------------------------------------------------
# The "lossless" profile. Keep these: they are the fallback for the examples
# above, and they make sure every file type Immich accepts is accepted here.
# ---------------------------------------------------------------------------
- name: jpeg-xl
  command: |
    cjxl --lossless_jpeg=1 -d 0 \
      "{{.src_folder}}/{{.name}}.{{.extension}}" \
      "{{.dst_folder}}/{{.name}}.jxl"
  extensions:
  - jpeg
  - jpg
  - png
  - pgx
  - pam
  - pnm
  - pgm
  - ppm
  - pfm
  - gif
  - exr

- name: caesium
  command: |
    caesiumclt --keep-dates --exif --lossless \
      --output="{{.dst_folder}}" \
      "{{.src_folder}}/{{.name}}.{{.extension}}"
  extensions:
  - jpeg
  - jpg
  - png
  - tiff
  - tif
  - webp
  - gif

# Note not all image formats accepted by immich are supported by jpeg-xl and caesium so passthrough the rest as-is.
# https://immich.app/docs/features/supported-formats/
- name: passthrough-images
  command: ""
  extensions:
  - avif
  - bmp
  - heic
  - heif
  - insp
  - jxl
  - psd
  - raw
  - rw2
  - svg

# Not aware of any lossless video conversion that will result in a smaller file size than the original so keep them as-is.
# Check out config folder for lossy video conversion examples.
- name: passthrough-videos
  command: ""
  extensions:
  - 3gp
  - 3gpp
  - avi
  - flv
  - m4v
  - mkv
  - mts
  - m2ts
  - m2t
  - mp4
  - insv
  - mpg
  - mpe
  - mpeg
  - mov
  - webm
  - wmv

# Every other image format Immich accepts (including camera RAW) is uploaded as it is.
- name: passthrough-other-images
  command: ""
  extensions:
  - jfif
  - hif
  - jp2
  - jpe
  - mpo
  - 3fr
  - ari
  - arw
  - cap
  - cin
  - cr2
  - cr3
  - crw
  - dcr
  - dng
  - erf
  - fff
  - iiq
  - k25
  - kdc
  - mrw
  - nef
  - nrw
  - orf
  - ori
  - pef
  - raf
  - rwl
  - sr2
  - srf
  - srw
  - x3f

# Every other video format Immich accepts is uploaded as it is.
- name: passthrough-other-videos
  command: ""
  extensions:
  - mxf
  - ts
  - vob
